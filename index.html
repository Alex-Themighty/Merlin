    <style>

        /* =========================================================
           ROOT COLORS
        ========================================================= */

        :root {
            --bg-color: #040406;
            --tron-cyan: #00f3ff;
            --magic-pink: #ff00ea;
            --gold-fruit: #ffd700;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;

            margin: 0;
            padding: 0;

            display: flex;
            flex-direction: column;
            align-items: center;

            min-height: 100vh;

            overflow-x: hidden;

            position: relative;
        }

        /* =========================================================
           TRON FLOOR GRID
        ========================================================= */

        .tron-grid {
            position: absolute;
            bottom: 0;
            left: -50%;

            width: 200%;
            height: 40vh;

            background-image:
                linear-gradient(transparent 95%, rgba(0, 243, 255, 0.2) 100%),
                linear-gradient(90deg, transparent 95%, rgba(0, 243, 255, 0.2) 100%);

            background-size: 40px 40px;

            transform: perspective(600px) rotateX(75deg);
            transform-origin: bottom;

            z-index: 0;

            pointer-events: none;

            box-shadow: inset 0 50px 100px var(--bg-color);
        }

        /* =========================================================
           PARTICLES
        ========================================================= */

        .particles-container {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            z-index: 1;

            pointer-events: none;
        }

        .particle {
            position: absolute;
            bottom: -30px;

            font-size: 1.8rem;
            font-family: 'Cinzel', serif;

            color: var(--magic-pink);

            text-shadow:
                0 0 10px var(--magic-pink),
                0 0 20px var(--magic-pink);

            animation: floatUp linear infinite;

            opacity: 0;
        }

        .particle:nth-child(even) {
            color: var(--tron-cyan);

            text-shadow:
                0 0 10px var(--tron-cyan),
                0 0 20px var(--tron-cyan);

            font-size: 1.4rem;
        }

        @keyframes floatUp {

            0% {
                transform: translateY(0) translateX(0) scale(1) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            90% {
                opacity: 0.8;
            }

            100% {
                transform:
                    translateY(-100vh)
                    translateX(50px)
                    scale(0.5)
                    rotate(180deg);

                opacity: 0;
            }
        }


        /* =========================================================
           HEADER
        ========================================================= */

        .header {
            text-align: center;
            margin-top: 40px;

            z-index: 10;
            position: relative;
        }

        .header h1 {
            font-family: 'Cinzel', serif;

            font-size: 3.5rem;

            color: #ffffff;

            text-shadow:
                0 0 10px rgba(0, 243, 255, 0.5),
                0 0 20px var(--tron-cyan);

            margin: 0;

            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.2rem;

            color: var(--magic-pink);

            letter-spacing: 4px;

            text-transform: uppercase;

            text-shadow: 0 0 8px var(--magic-pink);

            margin-top: 5px;

            font-weight: 600;
        }

        /* =========================================================
           LOGIN ICON
        ========================================================= */

        .login-icon {

            position: fixed;

            top: 25px;
            right: 30px;

            width: 60px;
            height: 60px;

            border-radius: 50%;

            border: 2px solid var(--tron-cyan);

            background: rgba(4, 4, 6, 0.8);

            backdrop-filter: blur(10px);

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            z-index: 999;

            box-shadow:
                0 0 15px var(--tron-cyan),
                inset 0 0 10px rgba(0,243,255,0.3);

            transition: 0.3s;
        }

        .login-icon:hover {
            transform: scale(1.08);

            box-shadow:
                0 0 25px var(--tron-cyan),
                0 0 40px rgba(255,255,255,0.4);
        }

        .login-icon svg {
            width: 28px;
            height: 28px;

            fill: var(--tron-cyan);
        }

        /* =========================================================

        :root {

               NODE WIDTHS
            ====================================== */

            --node-width: 160px;
            --sentence-width: 180px;
            --essay-width: 220px;

               NODE HEIGHT / FONT
            ====================================== */

            --node-padding-y: 14px;
            --node-padding-x: 18px;

            --node-font-size: 1.2rem;
            --essay-font-size: 1.45rem;

               LETTERS POSITION
            ====================================== */

            --letters-left: 50%;
            --letters-bottom: 8%;

            /* ======================================
               WORDS POSITION
            ====================================== */

            --words-left: 50%;
            --words-bottom: 27%;

            /* ======================================
               PHRASES POSITION
            ====================================== */

            --phrases-left: 18%;
            --phrases-bottom: 41%;

            /* ======================================
               CLAUSES POSITION
            ====================================== */

            --clauses-left: 82%;
            --clauses-bottom: 41%;

            /* ======================================
               SENTENCES POSITION
            ====================================== */

            --sentence-left: 50%;
            --sentence-bottom: 41%;

            /* ======================================
               PARAGRAPHS POSITION
            ====================================== */

            --paragraph-left: 50%;
            --paragraph-top: 35%;

            /* ======================================
               ESSAYS POSITION
            ====================================== */

            --essay-left: 50%;
            --essay-top: 13%;
        }

        /* =========================================================
           NODE BASE
        ========================================================= */

        .node {

            position: absolute;

            width: var(--node-width);

            background: rgba(4, 4, 6, 0.8);

            border: 2px solid var(--tron-cyan);

            box-shadow:
                0 0 15px var(--tron-cyan),
                inset 0 0 10px rgba(0, 243, 255, 0.3);

            border-radius: 8px;

            padding:
                var(--node-padding-y)
                var(--node-padding-x);

            color: white;

            font-size: var(--node-font-size);

            font-weight: 700;

            letter-spacing: 1px;

            cursor: pointer;

            text-align: center;

            backdrop-filter: blur(5px);

            text-decoration: none;

            opacity: 0;

            transform: translateX(-50%) scale(0.5);

            animation: popIn 0.5s ease-out forwards;

            transition:
                all 0.3s
                cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .node:hover {

            transform:
                translateX(-50%)
                scale(1.15)
                translateY(-5px);

            background: var(--tron-cyan);

            color: black;

            border-color: white;

            box-shadow:
                0 0 25px var(--tron-cyan),
                0 0 40px rgba(255,255,255,0.8);
        }

           SPECIAL GOLD NODE
        ========================================================= */

        .essay-node {

            width: var(--essay-width);

            font-size: var(--essay-font-size);

            border-color: var(--gold-fruit);

            box-shadow:
                0 0 20px var(--gold-fruit);
        }

        .essay-node:hover {

            background: var(--gold-fruit);

            box-shadow:
                0 0 35px var(--gold-fruit);
        }

        .sentence-node {
            width: var(--sentence-width);
        }

        /* =========================================================
           NODE POSITIONS
        ========================================================= */

        .letters-node {

            left: var(--letters-left);
            bottom: var(--letters-bottom);

            border-color: var(--magic-pink);

            box-shadow:
                0 0 15px var(--magic-pink);

            animation-delay: 0.5s;
        }

        .words-node {

            left: var(--words-left);
            bottom: var(--words-bottom);

            animation-delay: 1s;
        }

        .phrases-node {

            left: var(--phrases-left);
            bottom: var(--phrases-bottom);

        }

        .clauses-node {

            animation-delay: 2s;

        .sentence-node {

            bottom: var(--sentence-bottom);

            animation-delay: 2.5s;

        .paragraph-node {

            top: var(--paragraph-top);

            animation-delay: 3s;
        }

        .essay-node {

            left: var(--essay-left);
            top: var(--essay-top);

            animation-delay: 3.5s;

        @keyframes popIn {

                opacity: 1;

           LOGIN MODAL
        ========================================================= */

        .modal-overlay {

            position: fixed;

let unlockedLevel = 1;

const nodes = document.querySelectorAll(".node");

function applyUnlockedLevel(level) {

    unlockedLevel =
        Number(level) || 1;

    nodes.forEach(node => {

        const nodeLevel =
            parseInt(node.dataset.level);

        if (nodeLevel > unlockedLevel) {

            node.classList.add("locked-node");

        } else {

            node.classList.remove("locked-node");
        }
    });
}

window.applyUnlockedLevel =
    applyUnlockedLevel;

applyUnlockedLevel(unlockedLevel);

                await getDoc(studentRef);

            if (!snapshot.exists()) {

                const startingProgress = {
                    displayName: user.displayName || "",
                    email: user.email || "",
                    unlockedLevel: 1,
                    completedLessons: [],
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp()
                };

                await setDoc(
                    studentRef,
                    startingProgress
                );

                return startingProgress;
            }

            await setDoc(
                studentRef,
                {
                    displayName: user.displayName || "",
                    email: user.email || "",
                    lastLoginAt: serverTimestamp()
                },
                { merge: true }
            );

            return snapshot.data();
        }

        window.loginWithGoogle = async function () {

            const provider =
                new GoogleAuthProvider();

            try {

                await signInWithPopup(
                    firebaseAuth,
                    provider
                );

            } catch (error) {

                alert(
                    "Google login failed: " +
                    error.message
                );
            }
        };

        window.logoutFirebaseUser = async function () {

            try {

                if (firebaseAuth) {

                    await signOut(firebaseAuth);
                }

            } finally {

                localStorage.removeItem(
                    "accountType"
                );

                location.reload();
            }
        };

        window.saveStudentProgress = async function (
            nextUnlockedLevel,
            completedLesson
        ) {

            if (!currentStudent || !firestoreDb) {

                alert("Please sign in before saving progress.");

                return;
            }

            const studentRef =
                doc(firestoreDb, "users", currentStudent.uid);

            const progressUpdate = {
                unlockedLevel: Number(nextUnlockedLevel) || 1,
                updatedAt: serverTimestamp()
            };

            if (completedLesson) {

                progressUpdate.completedLessons =
                    arrayUnion(completedLesson);
            }

            await setDoc(
                studentRef,
                progressUpdate,
                { merge: true }
            );

            if (window.applyUnlockedLevel) {

                window.applyUnlockedLevel(
                    progressUpdate.unlockedLevel
                );
            }
        };

        const firebaseApp =
            initializeApp(firebaseConfig);

        firebaseAuth =
            getAuth(firebaseApp);

        firestoreDb =
            getFirestore(firebaseApp);

        onAuthStateChanged(
            firebaseAuth,
            async (user) => {

                if (!user) {

                    return;
                }

                currentStudent =
                    user;

                if (
                    localStorage.getItem("accountType") ===
                    "archmage"
                ) {

                    return;
                }

                localStorage.setItem(
                    "accountType",
                    "student"
                );

                activateStudentMode(user);

                const progress =
                    await loadOrCreateStudentProgress(user);

                if (window.applyUnlockedLevel) {

                    window.applyUnlockedLevel(
                        progress.unlockedLevel || 1
                    );
                }
            }
        );

    </script>

</body>
</html>
