<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 4: Clauses</title>
    <!-- React and Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@700&family=JetBrains+Mono:wght@700&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d0415; /* Deep purple background */
        }

        .font-sans { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair+Display', serif; }
        .font-mono { font-family: 'JetBrains+Mono', monospace; }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4c1d95; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6d28d9; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const GameState = {
            init: () => {
                if (localStorage.getItem('eng_lives') === null) localStorage.setItem('eng_lives', '5');
                if (localStorage.getItem('eng_highest_level') === null) localStorage.setItem('eng_highest_level', '4'); 
                if (localStorage.getItem('eng_level4_viewed') === null) localStorage.setItem('eng_level4_viewed', JSON.stringify({}));
            },
            getLives: () => parseInt(localStorage.getItem('eng_lives') || '5'),
            getHighestLevel: () => parseInt(localStorage.getItem('eng_highest_level') || '4'),
            markNodeViewed: (id) => {
                const viewed = JSON.parse(localStorage.getItem('eng_level4_viewed') || '{}');
                viewed[id] = true;
                localStorage.setItem('eng_level4_viewed', JSON.stringify(viewed));
            }
        };

        const Icon = ({ name, size = 24, className = "", fill = "none" }) => {
            const icons = {
                Heart: (props) => <svg {...props} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>,
                Lock: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
                Unlock: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>,
                ChevronLeft: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>,
                ChevronRight: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>,
                Blocks: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>,
                Home: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
                AlertCircle: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>,
                ExternalLink: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            };
            const IconComp = icons[name];
            return IconComp ? <IconComp className={className} style={{width: size, height: size}} /> : null;
        };

        function App() {
            const [lives, setLives] = useState(5);
            const [highestLevel, setHighestLevel] = useState(4);
            const currentLevel = 4; // Level 4 context!

            useEffect(() => {
                GameState.init();
                setLives(GameState.getLives());
                setHighestLevel(GameState.getHighestLevel());
                GameState.markNodeViewed('clause_theory');
            }, []);

            // Robust custom scroll handler for nested containers
            const scrollToSection = (id) => {
                const element = document.getElementById(id);
                const container = document.getElementById('scroll-container');
                if (element && container) {
                    const containerTop = container.getBoundingClientRect().top;
                    const elementTop = element.getBoundingClientRect().top;
                    const currentScroll = container.scrollTop;
                    
                    // Scrolls to exactly 40px above the element for a clean view
                    container.scrollTo({
                        top: currentScroll + (elementTop - containerTop) - 40,
                        behavior: 'smooth'
                    });
                } else if (element) {
                    element.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            };

            const HeartsHUD = () => (
                <div className="flex items-center gap-4 bg-[#150724]/80 px-5 py-2.5 rounded-full border border-red-500/30 shadow-[0_0_20px_rgba(239,68,68,0.1)]">
                    <div className="flex space-x-2">
                        {[1, 2, 3, 4, 5].map(i => (
                            <div key={i} className={i <= lives ? "animate-pulse" : ""}>
                                <Icon 
                                    name="Heart" 
                                    size={22} 
                                    className={`${i <= lives ? "text-red-500 drop-shadow-[0_0_12px_rgba(239,68,68,1)]" : "text-slate-900"}`} 
                                    fill={i <= lives ? "currentColor" : "none"}
                                />
                            </div>
                        ))}
                    </div>
                    <div className="h-5 w-px bg-purple-900/50 mx-1"></div>
                    <div className="font-mono font-bold text-red-500 tracking-tighter text-2xl italic drop-shadow-[0_0_8px_rgba(239,68,68,0.6)]">
                        {lives}<span className="text-red-900/40 px-0.5">/</span>5
                    </div>
                </div>
            );

            const ProgressColumn = () => (
                <div className="w-32 bg-[#08020d]/90 border-l border-purple-900/40 flex flex-col items-center py-6 z-40 shadow-[-10px_0_30px_rgba(0,0,0,0.5)]">
                    <div className="text-purple-400/70 font-serif text-xs font-bold uppercase tracking-widest mb-4">Mastery</div>
                    <div className="relative flex-1 w-full flex justify-center py-4">
                        <div className="relative w-10 bg-slate-950 border-2 border-purple-900/60 rounded-full shadow-[inset_0_0_20px_rgba(0,0,0,1)] overflow-hidden flex flex-col justify-between">
                            <div 
                                className="absolute bottom-0 left-0 w-full bg-gradient-to-t from-red-600 via-green-500 via-blue-500 to-purple-600 transition-all duration-1000 ease-in-out shadow-[0_0_25px_rgba(168,85,247,0.4)]"
                                style={{ height: `${(highestLevel / 7) * 100}%` }}
                            >
                                <div className="absolute top-0 w-full h-2 bg-white/40 blur-[1px]"></div>
                            </div>
                            {[7, 6, 5, 4, 3, 2, 1].map((level) => {
                                const isUnlocked = level <= highestLevel;
                                const isCurrent = level === currentLevel;
                                return (
                                    <div key={level} className="relative z-10 w-full flex-1 flex flex-col justify-center items-center border-b border-purple-950/30 last:border-b-0">
                                        {isCurrent && (
                                            <div className="absolute -left-10 text-purple-400 drop-shadow-[0_0_8px_rgba(168,85,247,0.9)] animate-pulse">
                                                <Icon name="ChevronRight" size={24} />
                                            </div>
                                        )}
                                        {isCurrent && (
                                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-0">
                                                <div className="w-7 h-7 rounded-full bg-white/20 border-2 border-white/40 shadow-[0_0_15px_rgba(255,255,255,0.8)] backdrop-blur-sm animate-bounce relative">
                                                    <div className="absolute top-1 right-1 w-2 h-2 bg-white/80 rounded-full blur-[0.5px]"></div>
                                                </div>
                                            </div>
                                        )}
                                        <span className={`relative z-10 font-serif font-bold text-lg drop-shadow-md transition-colors duration-500 ${isUnlocked ? 'text-slate-100' : 'text-purple-900/50'}`}>
                                            {level}
                                        </span>
                                        <div className="absolute -right-8">
                                            {isUnlocked ? <Icon name="Unlock" size={14} className="text-purple-400 drop-shadow-[0_0_5px_rgba(168,85,247,0.5)]" /> : <Icon name="Lock" size={14} className="text-purple-900/50" />}
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="flex flex-col h-screen w-full bg-[#0d0415] text-white font-sans overflow-hidden relative">
                    <div className="absolute inset-0 bg-[radial-gradient(circle_at_top,_rgba(168,85,247,0.12),transparent_70%)] pointer-events-none"></div>

                    {/* Header */}
                    <div className="h-24 border-b border-purple-900/40 bg-[#0d0415]/80 backdrop-blur-md flex justify-between items-center px-12 z-50 shadow-[0_4px_30px_rgba(0,0,0,0.8)] flex-shrink-0">
                        <div className="flex items-center gap-6">
                            <button onClick={() => window.location.href = 'index.html'} className="text-purple-400 hover:text-purple-300 transition-colors flex items-center gap-2 font-mono text-sm uppercase tracking-widest bg-[#150724]/80 px-4 py-2 rounded-full border border-purple-500/30 shadow-[0_0_10px_rgba(168,85,247,0.2)]">
                                <Icon name="ChevronLeft" size={18} /> HOME
                            </button>
                            <div className="flex flex-col">
                                <div className="text-[10px] text-purple-400 font-bold tracking-[0.5em] uppercase mb-1 font-mono">Archive_Access // Theory</div>
                                <div className="text-amber-200 font-serif text-3xl font-bold uppercase tracking-[0.15em] drop-shadow-[0_0_15px_rgba(253,224,71,0.3)]">Level 4: Clauses</div>
                            </div>
                        </div>
                        <div className="flex items-center gap-6">
                            <HeartsHUD />
                        </div>
                    </div>

                    <div className="flex-1 flex flex-row overflow-hidden">
                        <div id="scroll-container" className="flex-1 w-full relative p-8 lg:p-12 overflow-y-auto custom-scrollbar scroll-smooth flex flex-col items-center">
                            <div className="max-w-5xl w-full flex flex-col pb-24">
                                
                                {/* ---------------- TREE VISUALIZATION ---------------- */}
                                <div className="flex flex-col items-center mb-16 pt-8">
                                    <div className="text-5xl lg:text-6xl font-serif font-black text-amber-400 tracking-[0.3em] mb-2 drop-shadow-[0_0_25px_rgba(245,158,11,0.3)]">CLAUSES</div>
                                    <div className="text-purple-300 font-mono tracking-widest text-sm mb-6 uppercase">LEGO: Building Blocks for Sentences</div>
                                    
                                    <div className="w-px h-10 bg-amber-600/50"></div>
                                    
                                    {/* Category Split */}
                                    <div className="relative flex flex-col items-center w-full">
                                        {/* Horizontal Line calculating the exact parting distance */}
                                        <div className="absolute top-0 w-[352px] h-px bg-amber-600/50 left-1/2 -translate-x-1/2"></div>

                                        <div className="flex justify-center gap-32 pt-0 w-full">

                                            {/* LEFT BRANCH: INDEPENDENT */}
                                            <div className="flex flex-col items-center w-56">
                                                <div className="w-px h-8 bg-amber-600/50"></div>
                                                
                                                <button onClick={() => scrollToSection('independent')} className="border border-blue-500/50 bg-slate-900/90 px-6 py-4 rounded shadow-[0_0_15px_rgba(59,130,246,0.2)] text-blue-300 font-bold tracking-widest uppercase text-sm z-10 text-center hover:bg-slate-800 transition-colors w-full flex flex-col items-center">
                                                    Independent
                                                    <span className="text-[10px] font-mono opacity-70 mt-1">(Main)</span>
                                                </button>
                                            </div>

                                            {/* RIGHT BRANCH: DEPENDENT */}
                                            <div className="flex flex-col items-center w-56">
                                                <div className="w-px h-8 bg-amber-600/50"></div>
                                                
                                                <button onClick={() => scrollToSection('dependent')} className="border border-emerald-500/50 bg-slate-900/90 px-6 py-4 rounded shadow-[0_0_15px_rgba(52,211,153,0.2)] text-emerald-300 font-bold tracking-widest uppercase text-sm z-10 text-center hover:bg-slate-800 transition-colors w-full flex flex-col items-center">
                                                    Dependent
                                                    <span className="text-[10px] font-mono opacity-70 mt-1">(Subordinate)</span>
                                                </button>
                                                
                                                <div className="w-px h-8 bg-emerald-600/50"></div>
                                                
                                                {/* Sub-branches for N, Adj, Adv */}
                                                <div className="relative flex flex-col items-center w-full">
                                                    {/* Perfect width line matching the center points (distance between centers of 3 w-28 nodes with gap-4 is 256px) */}
                                                    <div className="absolute top-0 w-[256px] h-px bg-emerald-600/50 left-1/2 -translate-x-1/2"></div>
                                                    
                                                    <div className="flex justify-center gap-4 pt-0">
                                                        <div className="flex flex-col items-center w-28">
                                                            <div className="w-px h-6 bg-emerald-600/50"></div>
                                                            <button onClick={() => scrollToSection('noun-clause')} className="w-full py-2 bg-slate-900 border border-amber-500/50 text-amber-300 rounded text-center text-sm tracking-wider uppercase font-bold hover:bg-slate-800 transition-colors z-10 shadow-[0_0_10px_rgba(245,158,11,0.15)]">Noun</button>
                                                        </div>
                                                        <div className="flex flex-col items-center w-28">
                                                            <div className="w-px h-6 bg-emerald-600/50"></div>
                                                            <button onClick={() => scrollToSection('adj-clause')} className="w-full py-2 bg-slate-900 border border-blue-500/50 text-blue-300 rounded text-center text-sm tracking-wider uppercase font-bold hover:bg-slate-800 transition-colors z-10 shadow-[0_0_10px_rgba(59,130,246,0.15)]">Adjective</button>
                                                        </div>
                                                        <div className="flex flex-col items-center w-28">
                                                            <div className="w-px h-6 bg-emerald-600/50"></div>
                                                            <button onClick={() => scrollToSection('adv-clause')} className="w-full py-2 bg-slate-900 border border-emerald-500/50 text-emerald-300 rounded text-center text-sm tracking-wider uppercase font-bold hover:bg-slate-800 transition-colors z-10 shadow-[0_0_10px_rgba(52,211,153,0.15)]">Adverb</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                        </div>
                                    </div>
                                </div>


                                {/* ---------------- THEORY CONTENT BELOW ---------------- */}

                                {/* CRITICAL LEGO RULE */}
                                <div className="bg-[#150724]/80 border-2 border-amber-500/40 rounded-xl p-6 mb-12 shadow-[0_0_30px_rgba(245,158,11,0.15)] flex items-start gap-6">
                                    <Icon name="AlertCircle" className="text-amber-400 flex-shrink-0 mt-1" size={32} />
                                    <div>
                                        <h3 className="text-amber-400 font-bold uppercase tracking-widest text-lg mb-2 font-mono">Golden Syntax Law</h3>
                                        <p className="text-slate-200 text-2xl font-serif leading-relaxed">
                                            A sentence <strong className="text-red-400 uppercase tracking-wider">must</strong> bear at least one complete <strong className="text-blue-300">Main Clause</strong>.
                                        </p>
                                    </div>
                                </div>

                                {/* INDEPENDENT VS DEPENDENT */}
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-12">
                                    
                                    {/* MAIN CLAUSE - BLUE ACCENTS */}
                                    <div id="independent" className="bg-[#150724]/90 border border-blue-500/40 rounded-xl p-8 shadow-[0_0_30px_rgba(0,0,0,0.6)] relative overflow-hidden scroll-mt-28">
                                        <div className="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 rounded-full blur-[40px] -mr-10 -mt-10 pointer-events-none"></div>
                                        <h2 className="text-2xl font-serif font-bold text-blue-300 mb-6 border-b border-purple-900/50 pb-3">
                                            1. Independent (Main) Clause
                                        </h2>
                                        
                                        <div className="bg-slate-900/80 p-4 rounded border border-blue-500/30 mb-6 text-center font-mono text-blue-200">
                                            [ Subject + Verb ] = <strong className="text-green-400">Complete Thought</strong>
                                        </div>

                                        <p className="text-slate-300 text-lg mb-6 font-serif leading-relaxed">
                                            The backbone of any sentence. It expresses a complete, resolved thought and <strong className="text-green-400">can stand entirely on its own</strong> as a full sentence.
                                        </p>
                                        
                                        <div className="bg-blue-950/20 p-5 rounded-lg border border-blue-900/50 shadow-inner">
                                            <span className="text-blue-400 font-bold uppercase tracking-widest text-xs mb-3 block font-mono">Archive Example</span>
                                            <p className="text-slate-200 text-lg font-serif">"<strong className="text-blue-300 underline">The knight defeated</strong> the dragon."</p>
                                            <p className="text-slate-400 mt-2 italic font-sans text-sm">
                                                (We know who did what, and the story is complete).
                                            </p>
                                        </div>
                                    </div>

                                    {/* SUBORDINATE CLAUSE - GREEN ACCENTS */}
                                    <div id="dependent" className="bg-[#150724]/90 border border-emerald-500/40 rounded-xl p-8 shadow-[0_0_30px_rgba(0,0,0,0.6)] relative overflow-hidden scroll-mt-28">
                                        <div className="absolute top-0 right-0 w-32 h-32 bg-emerald-500/10 rounded-full blur-[40px] -mr-10 -mt-10 pointer-events-none"></div>
                                        <h2 className="text-2xl font-serif font-bold text-emerald-300 mb-6 border-b border-purple-900/50 pb-3">
                                            2. Dependent (Subord.) Clause
                                        </h2>
                                        
                                        <div className="bg-slate-900/80 p-4 rounded border border-emerald-500/30 mb-6 text-center font-mono text-emerald-200">
                                            [ Subordinator + Subject + Verb ] = <strong className="text-red-400">Incomplete Thought</strong>
                                        </div>

                                        <p className="text-slate-300 text-lg mb-6 font-serif leading-relaxed">
                                            The supporting cast. Because it begins with a Subordinator, it leaves a thought hanging. It <strong className="text-red-400">cannot</strong> stand alone.
                                        </p>
                                        
                                        <div className="bg-emerald-950/20 p-5 rounded-lg border border-emerald-900/50 shadow-inner">
                                            <span className="text-emerald-400 font-bold uppercase tracking-widest text-xs mb-3 block font-mono">Archive Example</span>
                                            <p className="text-slate-200 text-lg font-serif">"<strong className="text-red-400">Because</strong> <strong className="text-emerald-300 underline">the knight defeated</strong> the dragon..."</p>
                                            <p className="text-slate-400 mt-2 italic font-sans text-sm">
                                                (...what happened next? It requires a Main Clause to attach to).
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                {/* SUBORDINATOR SIGNALS */}
                                <div className="flex items-center gap-4 mb-8 mt-4">
                                    <h2 className="text-3xl font-serif font-bold text-amber-200 tracking-[0.1em] uppercase">Subordinator Signals</h2>
                                    <div className="flex-1 h-px bg-purple-900/50"></div>
                                </div>
                                <p className="text-slate-300 text-lg mb-6 font-serif">These are the specific triggers that downgrade an independent clause into a dependent one.</p>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                                    <div className="bg-[#150724]/80 p-6 rounded-xl border border-amber-500/30 text-center hover:border-amber-400/60 transition-colors">
                                        <h4 className="text-amber-300 font-bold uppercase tracking-widest text-sm mb-4 font-mono">1. Wh- Words</h4>
                                        <div className="font-serif text-slate-200 leading-loose text-lg">
                                            what, who, whom, whose, which, where, when, why, how
                                        </div>
                                    </div>

                                    <div className="bg-[#150724]/80 p-6 rounded-xl border border-blue-500/30 text-center hover:border-blue-400/60 transition-colors">
                                        <h4 className="text-blue-300 font-bold uppercase tracking-widest text-sm mb-4 font-mono">2. Relative Pronouns</h4>
                                        <div className="font-serif text-slate-200 leading-loose text-lg">
                                            who, whom, whose, which, that
                                        </div>
                                    </div>

                                    <div className="bg-[#150724]/80 p-6 rounded-xl border border-emerald-500/30 text-center hover:border-emerald-400/60 transition-colors flex flex-col items-center">
                                        <h4 className="text-emerald-300 font-bold uppercase tracking-widest text-sm mb-4 font-mono">3. Linking Words</h4>
                                        <div className="font-serif text-slate-200 leading-loose text-lg mb-4">
                                            although, because, if, since, unless, while...
                                        </div>
                                        <button 
                                            onClick={() => window.location.href = 'lw.html'}
                                            className="mt-auto px-4 py-2 border border-emerald-500/50 text-emerald-300 text-xs uppercase tracking-widest rounded hover:bg-emerald-900/30 transition-colors flex items-center gap-2 font-mono"
                                        >
                                            View Archive <Icon name="ExternalLink" size={14} />
                                        </button>
                                    </div>
                                </div>

                                {/* THE 3 TYPES OF SUBORDINATE CLAUSES */}
                                <div className="flex items-center gap-4 mb-8 mt-4">
                                    <h2 className="text-3xl font-serif font-bold text-amber-200 tracking-[0.1em] uppercase">The 3 Subordinate Types</h2>
                                    <div className="flex-1 h-px bg-purple-900/50"></div>
                                </div>

                                <div className="space-y-6 mb-12">
                                    {/* Noun Clause - YELLOW ACCENT */}
                                    <div id="noun-clause" className="bg-[#150724]/90 border border-amber-500/30 rounded-xl p-6 shadow-lg flex flex-col md:flex-row gap-6 items-start md:items-center hover:border-amber-500/60 transition-all scroll-mt-28">
                                        <div className="w-20 h-20 flex-shrink-0 bg-[#0f041a] rounded-xl border border-amber-500/40 flex items-center justify-center font-mono text-2xl text-amber-300 font-bold shadow-[0_0_15px_rgba(253,224,71,0.2)] transform rotate-3">
                                            [N]
                                        </div>
                                        <div className="flex-1 w-full">
                                            <h4 className="text-xl font-serif font-bold text-amber-300 mb-2">Noun Clause</h4>
                                            <p className="text-slate-300 text-sm font-serif mb-4">Functions entirely as a noun. It can act as a subject or an object within the overarching main clause.</p>
                                            <div className="bg-slate-900/80 p-3 rounded border border-purple-900/50 text-slate-200 font-serif text-sm">
                                                "I know <strong className="text-amber-300">[that you are lying]</strong>." <span className="text-slate-500 italic ml-2">(Acts as the Object)</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Adjective Clause - BLUE ACCENT */}
                                    <div id="adj-clause" className="bg-[#150724]/90 border border-blue-500/30 rounded-xl p-6 shadow-lg flex flex-col md:flex-row gap-6 items-start md:items-center hover:border-blue-500/60 transition-all scroll-mt-28">
                                        <div className="w-20 h-20 flex-shrink-0 bg-[#0f041a] rounded-xl border border-blue-500/40 flex items-center justify-center font-mono text-2xl text-blue-300 font-bold shadow-[0_0_15px_rgba(96,165,250,0.2)] transform -rotate-3">
                                            [Adj]
                                        </div>
                                        <div className="flex-1 w-full">
                                            <h4 className="text-xl font-serif font-bold text-blue-300 mb-2">Adjective (Relative) Clause</h4>
                                            <p className="text-slate-300 text-sm font-serif mb-4">Acts like a giant adjective to describe a preceding noun. Almost always begins with a Relative Pronoun.</p>
                                            <div className="bg-slate-900/80 p-3 rounded border border-purple-900/50 text-slate-200 font-serif text-sm">
                                                "The sword <strong className="text-blue-300">[that was forged in fire]</strong> glows brightly."
                                            </div>
                                        </div>
                                    </div>

                                    {/* Adverb Clause - GREEN ACCENT */}
                                    <div id="adv-clause" className="bg-[#150724]/90 border border-emerald-500/30 rounded-xl p-6 shadow-lg flex flex-col md:flex-row gap-6 items-start md:items-center hover:border-emerald-500/60 transition-all scroll-mt-28">
                                        <div className="w-20 h-20 flex-shrink-0 bg-[#0f041a] rounded-xl border border-emerald-500/40 flex items-center justify-center font-mono text-2xl text-emerald-300 font-bold shadow-[0_0_15px_rgba(52,211,153,0.2)] transform rotate-3">
                                            [Adv]
                                        </div>
                                        <div className="flex-1 w-full">
                                            <h4 className="text-xl font-serif font-bold text-emerald-300 mb-2">Adverb Clause</h4>
                                            <p className="text-slate-300 text-sm font-serif mb-4">Acts like a giant adverb. It describes the 'how, when, where, or why' of the main verb. Begins with a Linking Word.</p>
                                            <div className="bg-slate-900/80 p-3 rounded border border-purple-900/50 text-slate-200 font-serif text-sm">
                                                "<strong className="text-emerald-300">[Because it was raining]</strong>, the battle was delayed."
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                        
                        <ProgressColumn />
                        
                    </div>

                    {/* Footer Action Bar */}
                    <div className="h-28 w-full bg-[#0d0415]/95 border-t border-purple-900/40 p-6 flex items-center justify-center z-30 shadow-[0_-10px_30px_rgba(0,0,0,0.8)] px-12 flex-shrink-0">
                        <button onClick={() => window.location.href = 'clause-test.html'} className="px-16 py-4 rounded-md font-serif font-bold uppercase tracking-widest flex items-center gap-3 transition-all duration-500 text-lg bg-gradient-to-r from-amber-600 to-yellow-500 text-slate-950 shadow-[0_0_20px_rgba(245,158,11,0.6)] hover:shadow-[0_0_35px_rgba(245,158,11,0.9)] hover:scale-105 cursor-pointer">
                            <Icon name="Unlock" size={24} className="text-slate-950"/> TEST ME
                        </button>
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
