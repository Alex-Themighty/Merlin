<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 3: Phrases - Project A-12</title>
    
    <!-- React and Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@700&family=JetBrains+Mono:wght@700&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            background-color: #020617; /* Deep Slate Background */
            color: #e2e8f0;
        }

        .font-sans { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair+Display', serif; }
        .font-mono { font-family: 'JetBrains+Mono', monospace; }

        /* Custom Scrollbar - Cyan Theme */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #0e7490; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #164e63; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const GameState = {
            init: () => {
                if (localStorage.getItem('eng_lives') === null) localStorage.setItem('eng_lives', '5');
                if (localStorage.getItem('eng_highest_level') === null) localStorage.setItem('eng_highest_level', '5'); 
                if (localStorage.getItem('eng_level3_viewed') === null) localStorage.setItem('eng_level3_viewed', JSON.stringify({}));
            },
            getLives: () => parseInt(localStorage.getItem('eng_lives') || '5'),
            getHighestLevel: () => parseInt(localStorage.getItem('eng_highest_level') || '5'),
            getViewedNodes: () => JSON.parse(localStorage.getItem('eng_level3_viewed') || '{}'),
            loseLife: () => {
                const current = parseInt(localStorage.getItem('eng_lives') || '5');
                const next = Math.max(0, current - 1);
                localStorage.setItem('eng_lives', next.toString());
                return next;
            },
            markNodeViewed: (id) => {
                const viewed = JSON.parse(localStorage.getItem('eng_level3_viewed') || '{}');
                viewed[id] = true;
                localStorage.setItem('eng_level3_viewed', JSON.stringify(viewed));
                return viewed;
            }
        };

        const Icon = ({ name, size = 24, className = "", fill = "none" }) => {
            const icons = {
                Heart: (props) => (
                    <svg {...props} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                    </svg>
                ),
                Lock: (props) => (
                    <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                ),
                Unlock: (props) => (
                    <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>
                    </svg>
                ),
                CheckCircle: (props) => (
                    <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                ),
                ChevronLeft: (props) => (
                    <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                ),
                ChevronRight: (props) => (
                    <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                        <polyline points="9 18 15 12 9 6"/>
                    </svg>
                ),
                AlertCircle: (props) => (
                    <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                        <circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>
                    </svg>
                ),
                Lightbulb: (props) => (
                    <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                        <path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                    </svg>
                )
            };
            const IconComp = icons[name];
            return IconComp ? <IconComp className={className} style={{width: size, height: size}} /> : null;
        };

        const BranchNode = ({ title, abbr, link, align, desc, isViewed, onClick }) => (
            <div className="relative group z-20 flex">
                
                {/* Main Node Box */}
                <button 
                    onClick={() => onClick(abbr, link)}
                    className={`flex items-center w-[320px] p-5 bg-[#0a0f1e] border ${align === 'right' ? 'border-r-4 border-l border-y' : 'border-l-4 border-r border-y'} transition-all cursor-pointer shadow-[0_4px_20px_rgba(0,0,0,0.6)] relative z-10 text-left
                        ${isViewed ? 'border-green-500/80 shadow-[0_0_15px_rgba(74,222,128,0.2)]' : 'border-cyan-800/80 hover:border-cyan-400 hover:shadow-[0_0_25px_rgba(34,211,238,0.4)]'}`}
                >
                    {/* Tick moved to top right corner of the box */}
                    {isViewed && (
                        <div className="absolute top-2.5 right-2.5 z-20">
                            <Icon name="CheckCircle" size={18} className="bg-[#0a0f1e] rounded-full text-green-400 shadow-[0_0_8px_rgba(74,222,128,0.4)]" />
                        </div>
                    )}

                    <div className={`flex w-full items-center gap-6 ${align === 'right' ? 'flex-row-reverse text-right' : 'flex-row text-left'}`}>
                        {/* Diamond Icon Container */}
                        <div className={`w-14 h-14 shrink-0 bg-[#020617] flex items-center justify-center border-2 transition-all rotate-45 relative
                            ${isViewed ? 'border-green-500/80' : 'border-cyan-700 group-hover:border-cyan-400 group-hover:shadow-[0_0_20px_rgba(34,211,238,0.6)]'}`}>
                            <span className={`font-mono font-bold text-lg -rotate-45 ${isViewed ? 'text-lime-400' : 'text-amber-400'}`}>{abbr}</span>
                        </div>
                        {/* Title */}
                        <div className="flex-1">
                            <span className={`block font-serif tracking-wider transition-colors text-xl font-bold drop-shadow-[0_2px_4px_rgba(0,0,0,1)]
                                ${isViewed ? 'text-green-300' : 'text-cyan-50 group-hover:text-cyan-300'}`}>{title}</span>
                        </div>
                    </div>
                </button>

                {/* Hover Dropdown (Definition Only) */}
                <div className={`absolute top-0 bottom-0 flex items-center ${align === 'right' ? 'left-full ml-4' : 'right-full mr-4'} opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 z-0`}>
                    <div className="px-6 py-4 bg-cyan-950/95 border border-cyan-500/80 text-cyan-100 font-sans text-sm shadow-[0_0_20px_rgba(34,211,238,0.3)] backdrop-blur-md rounded-sm w-48 text-center leading-relaxed font-bold">
                        {desc}
                    </div>
                </div>

            </div>
        );

        function App() {
            const [lives, setLives] = useState(5);
            const [highestLevel, setHighestLevel] = useState(5);
            const [viewed, setViewed] = useState({});
            const [showLego, setShowLego] = useState(false);
            const currentLevel = 3;

            useEffect(() => {
                GameState.init();
                setLives(GameState.getLives());
                setHighestLevel(GameState.getHighestLevel());
                setViewed(GameState.getViewedNodes());
            }, []);

            const phraseNodes = [
                { id: 'NPhr', label: 'Noun Phrase', link: 'NPhr.html' },
                { id: 'VPhr', label: 'Verb Phrase', link: 'VPhr.html' },
                { id: 'AdjPhr', label: 'Adjective Phrase', link: 'AdjPhr.html' },
                { id: 'AdvPhr', label: 'Adverb Phrase', link: 'AdvPhr.html' },
                { id: 'PrepPhr', label: 'Prepositional Phrase', link: 'PrepPhr.html' },
                { id: 'LPhr', label: 'Linking Phrase', link: 'LPhr.html' }
            ];
            
            // Calculate stacked tests
            const unlockedTests = phraseNodes.filter(n => viewed[n.id]);
            const stackedTestCount = unlockedTests.length + (viewed.lego ? 1 : 0);
            const hasAnyTest = stackedTestCount > 0;
            const testUnlocked = unlockedTests.length === phraseNodes.length && viewed.lego;

            const handleNodeClick = (id, link) => {
                const updatedViewed = GameState.markNodeViewed(id);
                setViewed(updatedViewed);
                window.location.href = link;
            };

            const HeartsHUD = () => (
                <div className="flex items-center gap-4 bg-[#0a0f1e]/50 px-5 py-2.5 rounded-full border border-red-500/30 shadow-[0_0_20px_rgba(239,68,68,0.1)]">
                    <div className="flex space-x-2">
                        {[1, 2, 3, 4, 5].map(i => (
                            <div key={i} className={i <= lives ? "animate-pulse" : ""}>
                                <Icon 
                                    name="Heart" 
                                    size={22} 
                                    className={`${i <= lives ? "text-red-500 drop-shadow-[0_0_12px_rgba(239,68,68,1)]" : "text-slate-900"}`} 
                                    fill={i <= lives ? "currentColor" : "none"}
                                />
                            </div>
                        ))}
                    </div>
                    <div className="h-5 w-px bg-cyan-900/50 mx-1"></div>
                    <div className="font-mono font-bold text-red-500 tracking-tighter text-2xl italic drop-shadow-[0_0_8px_rgba(239,68,68,0.6)]">
                        {lives}<span className="text-red-900/40 px-0.5">/</span>5
                    </div>
                </div>
            );

            const ProgressColumn = () => (
                <div className="w-32 bg-[#020617]/90 border-l border-cyan-900/40 flex flex-col items-center py-6 z-40 shadow-[-10px_0_30px_rgba(0,0,0,0.5)]">
                    <div className="text-cyan-500/70 font-serif text-xs font-bold uppercase tracking-widest mb-4">Mastery</div>
                    <div className="relative flex-1 w-full flex justify-center py-4">
                        
                        {/* Magical Energy Pillar / Vial */}
                        <div className="relative w-10 bg-[#060b17] border-2 border-cyan-900/60 rounded-full shadow-[inset_0_0_20px_rgba(0,0,0,1)] overflow-hidden flex flex-col justify-between">
                            
                            <div 
                                className="absolute bottom-0 left-0 w-full bg-gradient-to-t from-red-600 via-green-500 via-blue-500 to-purple-600 transition-all duration-1000 ease-in-out shadow-[0_0_25px_rgba(244,114,182,0.4)]"
                                style={{ height: `${(highestLevel / 7) * 100}%` }}
                            >
                                <div className="absolute top-0 w-full h-2 bg-white/40 blur-[1px]"></div>
                            </div>

                            {[7, 6, 5, 4, 3, 2, 1].map((level) => {
                                const isUnlocked = level <= highestLevel;
                                const isCurrent = level === currentLevel;

                                return (
                                    <div key={level} className="relative z-10 w-full flex-1 flex flex-col justify-center items-center border-b border-cyan-950/30 last:border-b-0">
                                        {isCurrent && (
                                            <div className="absolute -left-10 text-cyan-400 drop-shadow-[0_0_8px_rgba(34,211,238,0.9)] animate-pulse">
                                                <Icon name="ChevronRight" size={24} />
                                            </div>
                                        )}
                                        {isCurrent && (
                                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-0">
                                                <div className="w-7 h-7 rounded-full bg-white/20 border-2 border-white/40 shadow-[0_0_15px_rgba(255,255,255,0.8)] backdrop-blur-sm animate-bounce relative">
                                                    <div className="absolute top-1 right-1 w-2 h-2 bg-white/80 rounded-full blur-[0.5px]"></div>
                                                </div>
                                            </div>
                                        )}
                                        <span className={`relative z-10 font-serif font-bold text-lg drop-shadow-md transition-colors duration-500 ${isUnlocked ? 'text-cyan-100' : 'text-cyan-900/50'}`}>
                                            {level}
                                        </span>
                                        <div className="absolute -right-8">
                                            {isUnlocked ? (
                                                <Icon name="Unlock" size={14} className="text-cyan-500 drop-shadow-[0_0_5px_rgba(34,211,238,0.5)]" />
                                            ) : (
                                                <Icon name="Lock" size={14} className="text-cyan-900/50" />
                                            )}
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="flex flex-col h-screen w-full bg-[#020617] text-white font-sans overflow-hidden relative">
                    {/* Cyan glow background */}
                    <div className="absolute inset-0 bg-[radial-gradient(circle_at_top,_rgba(6,182,212,0.05),transparent_70%)] pointer-events-none z-0"></div>

                    {/* Header HUD */}
                    <div className="h-24 border-b border-cyan-900/30 bg-[#060b17]/80 backdrop-blur-md flex justify-between items-center px-12 z-50 shadow-[0_4px_30px_rgba(0,0,0,0.7)] flex-shrink-0">
                        <div className="flex items-center gap-6">
                            {/* GLOBAL HOME BUTTON - EXACT MATCH */}
                            <button onClick={() => window.location.href = 'index.html'} className="text-amber-500/70 hover:text-amber-400 transition-colors flex items-center gap-2 font-mono text-sm uppercase tracking-widest bg-slate-900/50 px-4 py-2 rounded-full border border-amber-500/20">
                                <Icon name="ChevronLeft" size={18} /> HOME
                            </button>
                            <div className="flex flex-col">
                                <div className="text-[10px] text-cyan-600 font-bold tracking-[0.5em] uppercase mb-1 font-mono">Project A-12</div>
                                <div className="text-cyan-500 font-serif text-3xl font-bold uppercase tracking-[0.15em] drop-shadow-[0_0_10px_rgba(34,211,238,0.5)]">
                                    Level 3: Phrases
                                </div>
                            </div>
                        </div>
                        <div className="flex items-center gap-6">
                            <HeartsHUD />
                        </div>
                    </div>

                    {/* SPLIT LAYOUT FOR CONTENT & PROGRESS COLUMN */}
                    <div className="flex-1 flex flex-row overflow-hidden relative z-10">
                        
                        <div className="flex-1 relative flex flex-col items-center overflow-hidden">
                            
                            <div className="flex-1 w-full relative p-8 overflow-y-auto custom-scrollbar flex flex-col items-center pb-24">
                                
                                {/* INTERACTIVE GRAMMAR TREE */}
                                <div className="relative flex flex-col items-center w-full max-w-5xl mx-auto min-h-[800px] pt-10">
                                    
                                    {/* Root Node */}
                                    <div className="z-30 flex items-center justify-center mb-24 relative group">
                                        <div className="absolute w-44 h-44 border border-cyan-500/30 rotate-45 rounded-sm transition-transform duration-700 group-hover:rotate-[225deg]"></div>
                                        <div className="absolute w-40 h-40 bg-[#060b17] border-2 border-cyan-500 rotate-45 shadow-[0_0_40px_rgba(6,182,212,0.4)] group-hover:shadow-[0_0_60px_rgba(6,182,212,0.6)] transition-all"></div>
                                        <div className="z-10 text-center flex flex-col items-center justify-center w-40 h-40">
                                            <span className="font-serif text-2xl font-black text-cyan-300 tracking-[0.2em] uppercase block drop-shadow-[0_2px_10px_rgba(0,0,0,1)]">Phrases</span>
                                            <span className="font-mono text-cyan-400/80 text-xs tracking-[0.3em] mt-3 block font-bold">6 TYPES</span>
                                        </div>
                                    </div>

{/* Central Trunk Line */}
<div className="absolute top-[160px] h-[545px] left-1/2 w-1 bg-gradient-to-b from-cyan-400 via-cyan-800 to-transparent -translate-x-1/2 z-0 shadow-[0_0_15px_rgba(34,211,238,0.5)]"></div>

                                    {/* Tree Rows (2 Columns) */}
                                    <div className="w-full flex flex-col gap-20 z-10 relative">
                                        
                                        {/* Row 1: Noun & Verb */}
                                        <div className="flex w-full items-center">
                                            <div className="flex-1 flex justify-end relative">
                                                <BranchNode 
                                                    title="Noun Phrase" abbr="NPhr" link="NPhr.html" align="left" desc="Functions as a single Noun" 
                                                    isViewed={viewed['NPhr']} onClick={handleNodeClick} 
                                                />
                                                <div className="absolute right-0 top-1/2 w-16 h-1 bg-cyan-700 -translate-y-1/2 translate-x-full z-0 shadow-[0_0_10px_rgba(14,116,144,0.8)]"></div>
                                            </div>
                                            <div className="w-32 flex justify-center relative shrink-0"></div>
                                            <div className="flex-1 flex justify-start relative">
                                                <div className="absolute left-0 top-1/2 w-16 h-1 bg-cyan-700 -translate-y-1/2 -translate-x-full z-0 shadow-[0_0_10px_rgba(14,116,144,0.8)]"></div>
                                                <BranchNode 
                                                    title="Verb Phrase" abbr="VPhr" link="VPhr.html" align="right" desc="Functions as a single Verb" 
                                                    isViewed={viewed['VPhr']} onClick={handleNodeClick} 
                                                />
                                            </div>
                                        </div>

                                        {/* Row 2: Adjective & Adverb */}
                                        <div className="flex w-full items-center">
                                            <div className="flex-1 flex justify-end relative">
                                                <BranchNode 
                                                    title="Adjective Phrase" abbr="AdjPhr" link="AdjPhr.html" align="left" desc="Modifies a Noun or Pronoun" 
                                                    isViewed={viewed['AdjPhr']} onClick={handleNodeClick} 
                                                />
                                                <div className="absolute right-0 top-1/2 w-16 h-1 bg-cyan-700 -translate-y-1/2 translate-x-full z-0 shadow-[0_0_10px_rgba(14,116,144,0.8)]"></div>
                                            </div>
                                            <div className="w-32 flex justify-center relative shrink-0"></div>
                                            <div className="flex-1 flex justify-start relative">
                                                <div className="absolute left-0 top-1/2 w-16 h-1 bg-cyan-700 -translate-y-1/2 -translate-x-full z-0 shadow-[0_0_10px_rgba(14,116,144,0.8)]"></div>
                                                <BranchNode 
                                                    title="Adverb Phrase" abbr="AdvPhr" link="AdvPhr.html" align="right" desc="Modifies a Verb or Adjective" 
                                                    isViewed={viewed['AdvPhr']} onClick={handleNodeClick} 
                                                />
                                            </div>
                                        </div>

                                        {/* Row 3: Prepositional & Linking */}
                                        <div className="flex w-full items-center">
                                            <div className="flex-1 flex justify-end relative">
                                                <BranchNode 
                                                    title="Prepositional Phrase" abbr="PrepPhr" link="PrepPhr.html" align="left" desc="Shows a relationship" 
                                                    isViewed={viewed['PrepPhr']} onClick={handleNodeClick} 
                                                />
                                                <div className="absolute right-0 top-1/2 w-16 h-1 bg-cyan-700 -translate-y-1/2 translate-x-full z-0 shadow-[0_0_10px_rgba(14,116,144,0.8)]"></div>
                                            </div>
                                            <div className="w-32 flex justify-center relative shrink-0"></div>
                                            <div className="flex-1 flex justify-start relative">
                                                <div className="absolute left-0 top-1/2 w-16 h-1 bg-cyan-700 -translate-y-1/2 -translate-x-full z-0 shadow-[0_0_10px_rgba(14,116,144,0.8)]"></div>
                                                <BranchNode 
                                                    title="Linking Phrase" abbr="LPhr" link="LPhr.html" align="right" desc="Connects Ideas logically" 
                                                    isViewed={viewed['LPhr']} onClick={handleNodeClick} 
                                                />
                                            </div>
                                        </div>

                                    </div>
                                </div>

                                {/* LEGO Rules below the tree, aligned perfectly within the content flow */}
                                <div className="flex justify-end w-full max-w-6xl mx-auto mt-16 pr-[5%]">
                                    <button 
                                        onClick={() => { setShowLego(true); setViewed(v => ({...v, lego: true})); }}
                                        className={`px-8 py-4 border-2 rounded transition-all font-mono text-sm lg:text-base font-bold tracking-[0.15em] [word-spacing:-4px] uppercase z-20 shadow-[0_0_15px_rgba(0,0,0,0.5)]
                                            ${viewed.lego ? 'border-green-500/50 text-green-400 bg-green-500/5' : 'border-cyan-500/50 text-cyan-400 bg-cyan-950/40 hover:scale-105 hover:shadow-[0_0_20px_rgba(34,211,238,0.4)]'}`}
                                    >
                                        {viewed.lego ? '[ RULES_SYNCED ]' : '[ ACCESS_LEGO_RULES ]'}
                                    </button>
                                </div>

                            </div>

                            {/* Footer Testing Unit */}
                            <div className="h-28 w-full bg-[#030712]/90 border-t border-cyan-900/40 p-6 flex items-center justify-center z-[60] shadow-[0_-10px_30px_rgba(0,0,0,0.5)] backdrop-blur-md shrink-0">
                                {/* Increased z-index to guarantee it pops over the LEGO rules button */}
                                <div className="relative group flex justify-center z-[70]">
                                    {/* Animated Dropdown List of Unlocked Tests */}
                                    <div className={`absolute bottom-[calc(100%+16px)] flex flex-col w-72 bg-[#060b17] border border-cyan-500/50 rounded-lg shadow-[0_15px_40px_rgba(0,0,0,0.8)] transition-all duration-300 transform opacity-0 translate-y-4 pointer-events-none ${hasAnyTest ? 'group-hover:opacity-100 group-hover:translate-y-0 group-hover:pointer-events-auto' : ''} overflow-hidden z-[100]`}>
                                        <div className="bg-cyan-950/60 p-3 border-b border-cyan-500/30 text-cyan-400 font-bold uppercase tracking-widest text-[10px] text-center font-mono">
                                            Available Mastery Tests
                                        </div>
                                        <div className="max-h-64 overflow-y-auto custom-scrollbar">
                                            {unlockedTests.map(test => (
                                                <button
                                                    key={test.id}
                                                    onClick={() => window.location.href = `${test.id}-test.html`}
                                                    className="w-full px-5 py-4 border-b border-cyan-900/30 hover:bg-cyan-900/20 transition-colors flex items-center justify-between group/btn text-left"
                                                >
                                                    <span className="font-serif text-sm text-cyan-100 group-hover/btn:text-cyan-400 transition-colors">{test.label} Mastery</span>
                                                    <Icon name="ChevronRight" size={16} className="text-cyan-600 group-hover/btn:text-cyan-400 group-hover/btn:translate-x-1 transition-all" />
                                                </button>
                                            ))}
                                            {testUnlocked && (
                                                <button 
                                                    onClick={() => window.location.href = `level3-final-test.html`}
                                                    className="w-full px-5 py-4 bg-cyan-900/30 hover:bg-cyan-600/30 transition-colors flex items-center justify-between group/btn text-left border-t border-cyan-500/50"
                                                >
                                                    <span className="font-serif font-bold text-sm text-cyan-400 uppercase tracking-widest">Level 3 Final</span>
                                                    <Icon name="Unlock" size={16} className="text-cyan-500 group-hover/btn:scale-110 transition-transform" />
                                                </button>
                                            )}
                                        </div>
                                    </div>

                                    {/* Stacked YELLOW Test Button (Matches Words perfectly) */}
                                    <button 
                                        disabled={!hasAnyTest}
                                        onClick={() => window.location.href = 'quizcenter.html'} 
                                        className={`relative px-12 py-4 rounded-md font-serif font-bold uppercase tracking-widest flex items-center gap-3 transition-all duration-500 text-lg
                                            ${hasAnyTest 
                                            ? 'bg-gradient-to-r from-amber-600 to-yellow-500 text-slate-950 shadow-[0_0_20px_rgba(245,158,11,0.6)] hover:shadow-[0_0_35px_rgba(245,158,11,0.9)] hover:scale-105 cursor-pointer' 
                                            : 'bg-slate-900 border-2 border-slate-800 text-slate-600 cursor-not-allowed'}`}
                                    >
                                        {hasAnyTest && (
                                            <div className="absolute -top-3 -right-3 bg-red-500 text-white w-8 h-8 rounded-full flex items-center justify-center font-mono text-sm font-black border-2 border-slate-950 shadow-[0_0_10px_rgba(239,68,68,0.8)] z-10">
                                                {stackedTestCount}
                                            </div>
                                        )}
                                        {hasAnyTest ? <Icon name="Unlock" size={24} className="text-slate-950"/> : <Icon name="Lock" size={24} />}
                                        TEST ME
                                    </button>
                                </div>
                            </div>

                        </div>

                        {/* Right Side Progress Vial */}
                        <ProgressColumn />

                    </div>

                    {/* LEGO Modal */}
                    {showLego && (
                        <div className="fixed inset-0 bg-[#020617]/95 backdrop-blur-xl z-[100] flex items-center justify-center p-6">
                            <div className="bg-[#060b17] border border-cyan-500/50 rounded-lg p-10 max-w-3xl w-full shadow-[0_0_50px_rgba(34,211,238,0.3)] relative max-h-[90vh] overflow-y-auto custom-scrollbar">
                                <button onClick={() => setShowLego(false)} className="absolute top-6 right-6 text-cyan-700 hover:text-white transition-colors">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="w-8 h-8">
                                        <line x1="18" y1="6" x2="6" y2="18"></line>
                                        <line x1="6" y1="6" x2="18" y2="18"></line>
                                    </svg>
                                </button>
                                
                                <div className="flex items-center gap-3 mb-10 border-b border-cyan-900/50 pb-6">
                                    <Icon name="AlertCircle" className="text-cyan-400 drop-shadow-[0_0_8px_rgba(34,211,238,0.8)]" size={32} />
                                    <h2 className="text-3xl font-serif font-bold text-cyan-400 tracking-widest uppercase">LEGO Rules: Phrases</h2>
                                </div>
                                
                                <div className="text-cyan-200 space-y-12 mb-10 font-serif leading-relaxed">
                                    
                                    {/* Rule 1 */}
                                    <div>
                                        <h3 className="text-xl text-amber-400 font-bold mb-4 tracking-wide border-l-4 border-cyan-500 pl-3">01. Phrase Definition</h3>
                                        <p className="ml-4 mb-3 text-lg leading-relaxed">
                                            A phrase is a group of words acting as a single Part of Speech unit <strong className="text-cyan-400 uppercase tracking-wider">without</strong> a Subject-Verb pairing.
                                        </p>
                                        <div className="ml-4 bg-[#0a0f1e]/80 p-5 rounded-md text-lg border border-cyan-900/50 shadow-inner mt-6 leading-relaxed">
                                            <span className="text-green-400 font-bold uppercase tracking-widest text-sm mb-3 font-mono flex items-center gap-2">
                                                <Icon name="Lightbulb" size={16} /> Example Insight
                                            </span>
                                            <p className="text-cyan-100 mb-3">"<span className="italic">The mysterious glowing orb</span>" <span className="text-cyan-500/70 text-base font-mono ml-2">(Noun Phrase)</span></p>
                                            <p className="text-cyan-400/60 text-base border-t border-cyan-900/50 pt-3">
                                                This group contains nouns and adjectives, but lacks a verb. Because it functions as a single noun, it is a Noun Phrase.
                                            </p>
                                        </div>
                                    </div>

                                    {/* Rule 2 */}
                                    <div>
                                        <h3 className="text-xl text-amber-400 font-bold mb-4 tracking-wide border-l-4 border-cyan-500 pl-3">02. Minimum Content Requirement</h3>
                                        <p className="ml-4 mb-3 text-lg leading-relaxed">
                                            A phrase must contain at least <strong className="text-cyan-400 tracking-wide">one content word</strong> (Noun, Verb, Adjective, or Adverb) to anchor its meaning.
                                        </p>
                                        <div className="ml-4 bg-[#0a0f1e]/80 p-5 rounded-md text-lg border border-cyan-900/50 shadow-inner mt-6 leading-relaxed">
                                            <span className="text-green-400 font-bold uppercase tracking-widest text-sm mb-3 font-mono flex items-center gap-2">
                                                <Icon name="Lightbulb" size={16} /> Example Insight
                                            </span>
                                            <p className="text-slate-300 mb-3 text-lg text-red-400/80 line-through">"Under the"</p>
                                            <p className="text-cyan-400/60 text-base border-t border-cyan-900/50 pt-3 mb-5">
                                                This is <strong className="text-red-400">NOT</strong> a phrase. It consists solely of functional glue words (Preposition + Article).
                                            </p>
                                            <p className="text-cyan-100 mb-3 text-lg">"<span className="italic">Under the bed</span>"</p>
                                            <p className="text-cyan-400/60 text-base border-t border-cyan-900/50 pt-3">
                                                This <strong className="text-cyan-400">IS</strong> a Prepositional Phrase because the noun 'bed' anchors the structure.
                                            </p>
                                        </div>
                                    </div>

                                    {/* Rule 3 */}
                                    <div>
                                        <h3 className="text-xl text-amber-400 font-bold mb-4 tracking-wide border-l-4 border-cyan-500 pl-3">03. No Pronoun Phrase</h3>
                                        <p className="ml-4 mb-3 text-lg leading-relaxed">
                                            Pronouns stand alone to replace a noun or noun phrase. They <strong className="text-red-400 border-b border-red-500/50">do not form phrases</strong> of their own.
                                        </p>
                                        <div className="ml-4 bg-[#0a0f1e]/80 p-5 rounded-md text-lg border border-cyan-900/50 shadow-inner mt-6 leading-relaxed">
                                            <span className="text-green-400 font-bold uppercase tracking-widest text-sm mb-3 font-mono flex items-center gap-2">
                                                <Icon name="Lightbulb" size={16} /> Example Insight
                                            </span>
                                            <p className="text-cyan-100 mb-3">"<span className="italic">She is the chosen one.</span>"</p>
                                            <p className="text-cyan-400/60 text-base border-t border-cyan-900/50 pt-3">
                                                "She" is simply a subject pronoun, which may have been a phrase, e.g. 'She' = 'the girl with great magical talents'. Thus, there's no need for a classification of a "Pronoun Phrase" when it will just play the exact grammartical role of a N Phrase.
                                            </p>
                                        </div>
                                    </div>

                                </div>

                                <button 
                                    onClick={() => setShowLego(false)}
                                    className="w-full py-4 bg-[#020617] hover:bg-[#0a0f1e] text-cyan-400 rounded border border-cyan-900/50 font-serif font-bold tracking-widest uppercase transition-colors"
                                >
                                    I Understand The Rules
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
