<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 5: Sentences - Archive Access</title>
    <!-- React and Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@700&family=JetBrains+Mono:wght@700&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f0209; /* Deep mythic pink/magenta base */
        }

        .font-sans { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair+Display', serif; }
        .font-mono { font-family: 'JetBrains+Mono', monospace; }

        /* Custom Scrollbar - Mythic Pink */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f0209; }
        ::-webkit-scrollbar-thumb { background: #831843; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #be185d; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #9d174d; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const GameState = {
            init: () => {
                if (localStorage.getItem('eng_lives') === null) localStorage.setItem('eng_lives', '5');
                if (localStorage.getItem('eng_highest_level') === null) localStorage.setItem('eng_highest_level', '5'); 
                if (localStorage.getItem('eng_level5_viewed') === null) localStorage.setItem('eng_level5_viewed', JSON.stringify({}));
            },
            getLives: () => parseInt(localStorage.getItem('eng_lives') || '5'),
            getHighestLevel: () => parseInt(localStorage.getItem('eng_highest_level') || '5'),
            getViewedNodes: () => JSON.parse(localStorage.getItem('eng_level5_viewed') || '{}'),
            loseLife: () => {
                const current = parseInt(localStorage.getItem('eng_lives') || '5');
                const next = Math.max(0, current - 1);
                localStorage.setItem('eng_lives', next.toString());
                return next;
            },
            markNodeViewed: (id) => {
                const viewed = JSON.parse(localStorage.getItem('eng_level5_viewed') || '{}');
                viewed[id] = true;
                localStorage.setItem('eng_level5_viewed', JSON.stringify(viewed));
                return viewed;
            }
        };

        const Icon = ({ name, size = 24, className = "", fill = "none" }) => {
            const icons = {
                Heart: (props) => (
                    <svg {...props} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                    </svg>
                ),
                Lock: (props) => (
                    <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                ),
                Unlock: (props) => (
                    <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>
                    </svg>
                ),
                CheckCircle: (props) => (
                    <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                ),
                ChevronLeft: (props) => (
                    <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                ),
                ChevronRight: (props) => (
                    <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                        <polyline points="9 18 15 12 9 6"/>
                    </svg>
                ),
                AlertCircle: (props) => (
                    <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                        <circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>
                    </svg>
                )
            };
            const IconComp = icons[name];
            return IconComp ? <IconComp className={className} style={{width: size, height: size}} /> : null;
        };

        function App() {
            const [lives, setLives] = useState(5);
            const [highestLevel, setHighestLevel] = useState(5);
            const [viewed, setViewed] = useState({});
            const [showLego, setShowLego] = useState(false);
            const currentLevel = 5;

            useEffect(() => {
                GameState.init();
                setLives(GameState.getLives());
                setHighestLevel(GameState.getHighestLevel());
                setViewed(GameState.getViewedNodes());
            }, []);

            const sentenceNodes = [
                { id: 'simple', label: 'Simple', def: '1 Independent Clause.', link: 'simple.html' },
                { id: 'compound', label: 'Compound', def: '≥ 2 Independent Clauses connected by a Coordinator.', link: 'compound.html' },
                { id: 'complex', label: 'Complex', def: '1 Independent + ≥ 1 Dependent Clause connected by a Subordinator.', link: 'complex.html' },
                { id: 'ccplx', label: 'Compound-Complex', def: '≥ 2 Independent + ≥ 1 Dependent Clause.', link: 'ccplx.html' }
            ];
            
            // Calculate stacked tests
            const unlockedTests = sentenceNodes.filter(n => viewed[n.id]);
            const stackedTestCount = unlockedTests.length + (viewed.lego ? 1 : 0);
            const hasAnyTest = stackedTestCount > 0;
            const testUnlocked = unlockedTests.length === sentenceNodes.length && viewed.lego;

            const handleNodeClick = (node) => {
                const updatedViewed = GameState.markNodeViewed(node.id);
                setViewed(updatedViewed);
                window.location.href = node.link;
            };

            const HeartsHUD = () => (
                <div className="flex items-center gap-4 bg-[#1a0510]/50 px-5 py-2.5 rounded-full border border-red-500/30 shadow-[0_0_20px_rgba(239,68,68,0.1)]">
                    <div className="flex space-x-2">
                        {[1, 2, 3, 4, 5].map(i => (
                            <div key={i} className={i <= lives ? "animate-pulse" : ""}>
                                <Icon 
                                    name="Heart" 
                                    size={22} 
                                    className={`${i <= lives ? "text-red-500 drop-shadow-[0_0_12px_rgba(239,68,68,1)]" : "text-slate-900"}`} 
                                    fill={i <= lives ? "currentColor" : "none"}
                                />
                            </div>
                        ))}
                    </div>
                    <div className="h-5 w-px bg-pink-900/50 mx-1"></div>
                    <div className="font-mono font-bold text-red-500 tracking-tighter text-2xl italic drop-shadow-[0_0_8px_rgba(239,68,68,0.6)]">
                        {lives}<span className="text-red-900/40 px-0.5">/</span>5
                    </div>
                </div>
            );

            const ProgressColumn = () => (
                <div className="w-32 bg-[#0a0106]/90 border-l border-pink-900/40 flex flex-col items-center py-6 z-40 shadow-[-10px_0_30px_rgba(0,0,0,0.5)]">
                    <div className="text-pink-500/70 font-serif text-xs font-bold uppercase tracking-widest mb-4">Mastery</div>
                    <div className="relative flex-1 w-full flex justify-center py-4">
                        
                        {/* Magical Energy Pillar / Vial */}
                        <div className="relative w-10 bg-[#1a0510] border-2 border-pink-900/60 rounded-full shadow-[inset_0_0_20px_rgba(0,0,0,1)] overflow-hidden flex flex-col justify-between">
                            
                            <div 
                                className="absolute bottom-0 left-0 w-full bg-gradient-to-t from-red-600 via-green-500 via-blue-500 to-purple-600 transition-all duration-1000 ease-in-out shadow-[0_0_25px_rgba(244,114,182,0.4)]"
                                style={{ height: `${(highestLevel / 7) * 100}%` }}
                            >
                                <div className="absolute top-0 w-full h-2 bg-white/40 blur-[1px]"></div>
                            </div>

                            {[7, 6, 5, 4, 3, 2, 1].map((level) => {
                                const isUnlocked = level <= highestLevel;
                                const isCurrent = level === currentLevel;

                                return (
                                    <div key={level} className="relative z-10 w-full flex-1 flex flex-col justify-center items-center border-b border-pink-950/30 last:border-b-0">
                                        {isCurrent && (
                                            <div className="absolute -left-10 text-pink-400 drop-shadow-[0_0_8px_rgba(244,114,182,0.9)] animate-pulse">
                                                <Icon name="ChevronRight" size={24} />
                                            </div>
                                        )}
                                        {isCurrent && (
                                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-0">
                                                <div className="w-7 h-7 rounded-full bg-white/20 border-2 border-white/40 shadow-[0_0_15px_rgba(255,255,255,0.8)] backdrop-blur-sm animate-bounce relative">
                                                    <div className="absolute top-1 right-1 w-2 h-2 bg-white/80 rounded-full blur-[0.5px]"></div>
                                                </div>
                                            </div>
                                        )}
                                        <span className={`relative z-10 font-serif font-bold text-lg drop-shadow-md transition-colors duration-500 ${isUnlocked ? 'text-pink-100' : 'text-pink-900/50'}`}>
                                            {level}
                                        </span>
                                        <div className="absolute -right-8">
                                            {isUnlocked ? (
                                                <Icon name="Unlock" size={14} className="text-pink-500 drop-shadow-[0_0_5px_rgba(244,114,182,0.5)]" />
                                            ) : (
                                                <Icon name="Lock" size={14} className="text-pink-900/50" />
                                            )}
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    </div>
                </div>
            );

            const SentenceNode = ({ node }) => (
                <div className="flex flex-col items-center w-40">
                    <div className="w-px h-8 bg-pink-600/50 shadow-[0_0_5px_rgba(244,114,182,0.5)]"></div>
                    
                    {/* Wrapper group for tooltip */}
                    <div className="relative group z-20 hover:z-[100] w-full">
                        <button 
                            onClick={() => handleNodeClick(node)}
                            className={`w-full py-4 rounded border border-pink-500/40 bg-slate-900/90 hover:bg-slate-800 transition-all text-[11px] font-bold tracking-widest uppercase relative ${viewed[node.id] ? 'text-green-400 border-green-500/50 shadow-[0_0_10px_rgba(74,222,128,0.2)]' : 'text-pink-200 shadow-[0_0_15px_rgba(244,114,182,0.1)]'}`}
                        >
                            {node.label}
                            {viewed[node.id] && <Icon name="CheckCircle" size={12} className="absolute -top-1.5 -right-1.5 bg-slate-950 rounded-full text-green-400" />}
                        </button>
                        
                        {/* Dropdown Box appearing below the tag */}
                        <div className="absolute top-full left-1/2 -translate-x-1/2 mt-4 w-56 opacity-0 group-hover:opacity-100 pointer-events-none transition-all duration-300 transform -translate-y-2 group-hover:translate-y-0 z-50">
                            <div className="bg-[#1a0510] border border-pink-500/40 p-4 rounded-lg shadow-[0_10px_30px_rgba(0,0,0,0.8)] text-xs leading-relaxed text-pink-50/90 font-serif italic text-center relative">
                                {/* Pointer Arrow pointing Up */}
                                <div className="absolute -top-[6px] left-1/2 -translate-x-1/2 w-3 h-3 bg-[#1a0510] border-t border-l border-pink-500/40 rotate-45"></div>
                                <span className="relative z-10">{node.def}</span>
                            </div>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="flex flex-col h-screen w-full bg-[#0f0209] text-white font-sans overflow-hidden relative">
                    {/* Pink Mythic glow background */}
                    <div className="absolute inset-0 bg-[radial-gradient(circle_at_top,_rgba(244,114,182,0.1),transparent_70%)] pointer-events-none"></div>

                    {/* Header HUD */}
                    <div className="h-24 border-b border-pink-900/30 bg-[#1a0510]/80 backdrop-blur-md flex justify-between items-center px-12 z-50 shadow-[0_4px_30px_rgba(0,0,0,0.7)] flex-shrink-0">
                        <div className="flex items-center gap-6">
                            {/* GLOBAL HOME BUTTON - EXACT MATCH */}
                            <button onClick={() => window.location.href = 'index.html'} className="text-amber-500/70 hover:text-amber-400 transition-colors flex items-center gap-2 font-mono text-sm uppercase tracking-widest bg-slate-900/50 px-4 py-2 rounded-full border border-amber-500/20">
                                <Icon name="ChevronLeft" size={18} /> HOME
                            </button>
                            <div className="flex flex-col">
                                <div className="text-[10px] text-pink-600 font-bold tracking-[0.5em] uppercase mb-1 font-mono">Archive_Access</div>
                                <div className="text-pink-500 font-serif text-3xl font-bold uppercase tracking-[0.15em] drop-shadow-[0_0_10px_rgba(244,114,182,0.5)]">
                                    Level 5: Sentences
                                </div>
                            </div>
                        </div>
                        <div className="flex items-center gap-6">
                            <HeartsHUD />
                        </div>
                    </div>

                    {/* SPLIT LAYOUT FOR CONTENT & PROGRESS COLUMN */}
                    <div className="flex-1 flex flex-row overflow-hidden">
                        
                        <div className="flex-1 relative flex flex-col items-center">
                            
                            <div className="flex-1 w-full relative p-8 overflow-hidden flex flex-col justify-center">
                                
                                {/* SYMMETRICAL TREE STRUCTURE */}
                                <div className="relative flex flex-col items-center w-full max-w-6xl mx-auto">
                                    
                                    {/* Main Title & Trunk */}
                                    <div className="flex flex-col items-center mb-0">
                                        <div className="text-5xl lg:text-6xl font-serif font-black text-pink-400 tracking-[0.2em] mb-2 drop-shadow-[0_0_25px_rgba(244,114,182,0.3)]">SENTENCES</div>
                                        <div className="text-pink-600 font-mono tracking-widest text-sm mb-0 uppercase">Where Writing Begins</div>
                                        <div className="w-px h-10 bg-gradient-to-b from-pink-400 to-pink-600/60 mt-4"></div>
                                    </div>

                                    {/* Horizontal Branching */}
                                    <div className="relative flex justify-center w-full mt-0">
                                        
                                        {/* Horizontal Line: Centers are 672px apart (3 gaps of 64px + 4 widths of 160px) */}
                                        <div className="absolute top-0 w-[672px] h-px bg-pink-600/50 shadow-[0_0_5px_rgba(244,114,182,0.5)] left-1/2 -translate-x-1/2"></div>

                                        <div className="flex justify-center gap-16 pt-0 w-full">
                                            {sentenceNodes.map((node) => (
                                                <SentenceNode key={node.id} node={node} />
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                {/* LEGO Rules below the tree, aligned perfectly within the content flow */}
                                <div className="flex justify-end w-full max-w-6xl mx-auto mt-16 pr-[5%]">
                                    <button 
                                        onClick={() => { setShowLego(true); setViewed(v => ({...v, lego: true})); }}
                                        className={`px-8 py-4 border-2 rounded transition-all font-mono text-sm lg:text-base font-bold tracking-[0.15em] [word-spacing:-4px] uppercase z-20 shadow-[0_0_15px_rgba(0,0,0,0.5)]
                                            ${viewed.lego ? 'border-green-500/50 text-green-400 bg-green-500/5' : 'border-red-500/50 text-red-500 bg-red-950/40 hover:scale-105'}`}
                                    >
                                        {viewed.lego ? '[ RULES_SYNCED ]' : '[ ACCESS_LEGO_RULES ]'}
                                    </button>
                                </div>

                            </div>

                            {/* Footer Testing Unit */}
                            <div className="h-28 w-full bg-[#0a0106]/90 border-t border-pink-900/40 p-6 flex items-center justify-center z-[60] shadow-[0_-10px_30px_rgba(0,0,0,0.5)] backdrop-blur-md">
                                {/* Increased z-index to guarantee it pops over the LEGO rules button */}
                                <div className="relative group flex justify-center z-[70]">
                                    {/* Animated Dropdown List of Unlocked Tests */}
                                    <div className={`absolute bottom-[calc(100%+16px)] flex flex-col w-72 bg-[#1a0510] border border-pink-500/50 rounded-lg shadow-[0_15px_40px_rgba(0,0,0,0.8)] transition-all duration-300 transform opacity-0 translate-y-4 pointer-events-none ${hasAnyTest ? 'group-hover:opacity-100 group-hover:translate-y-0 group-hover:pointer-events-auto' : ''} overflow-hidden z-[100]`}>
                                        <div className="bg-pink-950/60 p-3 border-b border-pink-500/30 text-pink-400 font-bold uppercase tracking-widest text-[10px] text-center font-mono">
                                            Available Mastery Tests
                                        </div>
                                        <div className="max-h-64 overflow-y-auto custom-scrollbar">
                                            {unlockedTests.map(test => (
                                                <button
                                                    key={test.id}
                                                    onClick={() => window.location.href = `${test.id}-test.html`}
                                                    className="w-full px-5 py-4 border-b border-pink-900/30 hover:bg-pink-900/20 transition-colors flex items-center justify-between group/btn text-left"
                                                >
                                                    <span className="font-serif text-sm text-pink-100 group-hover/btn:text-pink-400 transition-colors">{test.label} Sentence Mastery</span>
                                                    <Icon name="ChevronRight" size={16} className="text-pink-600 group-hover/btn:text-pink-400 group-hover/btn:translate-x-1 transition-all" />
                                                </button>
                                            ))}
                                            {testUnlocked && (
                                                <button 
                                                    onClick={() => window.location.href = `level5-final-test.html`}
                                                    className="w-full px-5 py-4 bg-pink-900/30 hover:bg-pink-600/30 transition-colors flex items-center justify-between group/btn text-left border-t border-pink-500/50"
                                                >
                                                    <span className="font-serif font-bold text-sm text-pink-400 uppercase tracking-widest">Level 5 Final</span>
                                                    <Icon name="Unlock" size={16} className="text-pink-500 group-hover/btn:scale-110 transition-transform" />
                                                </button>
                                            )}
                                        </div>
                                    </div>

                                    {/* Stacked YELLOW Test Button (Matches Words perfectly) */}
                                    <button 
                                        disabled={!hasAnyTest}
                                        onClick={() => window.location.href = 'quizcenter.html'} 
                                        className={`relative px-12 py-4 rounded-md font-serif font-bold uppercase tracking-widest flex items-center gap-3 transition-all duration-500 text-lg
                                            ${hasAnyTest 
                                            ? 'bg-gradient-to-r from-amber-600 to-yellow-500 text-slate-950 shadow-[0_0_20px_rgba(245,158,11,0.6)] hover:shadow-[0_0_35px_rgba(245,158,11,0.9)] hover:scale-105 cursor-pointer' 
                                            : 'bg-slate-900 border-2 border-slate-800 text-slate-600 cursor-not-allowed'}`}
                                    >
                                        {hasAnyTest && (
                                            <div className="absolute -top-3 -right-3 bg-red-500 text-white w-8 h-8 rounded-full flex items-center justify-center font-mono text-sm font-black border-2 border-slate-950 shadow-[0_0_10px_rgba(239,68,68,0.8)] z-10">
                                                {stackedTestCount}
                                            </div>
                                        )}
                                        {hasAnyTest ? <Icon name="Unlock" size={24} className="text-slate-950"/> : <Icon name="Lock" size={24} />}
                                        TEST ME
                                    </button>
                                </div>
                            </div>

                        </div>

                        {/* Right Side Progress Vial */}
                        <ProgressColumn />

                    </div>

                    {/* LEGO Modal */}
                    {showLego && (
                        <div className="fixed inset-0 bg-[#0a0106]/95 backdrop-blur-xl z-[100] flex items-center justify-center p-6">
                            <div className="bg-[#1a0510] border border-red-500/50 rounded-lg p-10 max-w-2xl w-full shadow-[0_0_50px_rgba(239,68,68,0.3)] relative">
                                <button onClick={() => setShowLego(false)} className="absolute top-6 right-6 text-pink-700 hover:text-white transition-colors">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="w-8 h-8">
                                        <line x1="18" y1="6" x2="6" y2="18"></line>
                                        <line x1="6" y1="6" x2="18" y2="18"></line>
                                    </svg>
                                </button>
                                
                                <div className="flex items-center gap-3 mb-8 border-b border-red-900/50 pb-4">
                                    <Icon name="AlertCircle" className="text-red-500 drop-shadow-[0_0_8px_rgba(239,68,68,0.8)]" size={32} />
                                    <h2 className="text-3xl font-serif font-bold text-red-400 tracking-widest uppercase">LEGO Rules</h2>
                                </div>
                                
                                <div className="text-pink-200 space-y-8 mb-10 font-serif leading-relaxed">
                                    <div>
                                        <h3 className="text-xl text-amber-400 font-bold mb-4 tracking-wide border-l-4 border-red-500 pl-3">Golden Syntax Law</h3>
                                        <p className="ml-4 mb-3 text-2xl leading-relaxed">
                                            A sentence <strong className="text-red-400 uppercase tracking-wider">must</strong> bear at least one complete <strong className="text-pink-400">Main Clause</strong>.
                                        </p>
                                        <div className="ml-4 bg-[#0a0106]/80 p-5 rounded-md text-lg border border-pink-900/50 shadow-inner mt-6 leading-relaxed">
                                            <span className="text-green-400 font-bold uppercase tracking-widest text-sm mb-3 block font-mono">Example Insight</span>
                                            <p className="text-pink-100 mb-3">"<span className="italic">Because it was raining.</span>"</p>
                                            <p className="text-pink-400/60 text-base border-t border-pink-900/50 pt-3">
                                                This is a fragment. Even though it has a subject and verb, it begins with a subordinator, making it a dependent clause. It requires an independent clause to form a legal sentence.
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                <button 
                                    onClick={() => setShowLego(false)}
                                    className="w-full py-4 bg-[#0a0106] hover:bg-[#2a0518] text-red-400 rounded border border-red-900/50 font-serif font-bold tracking-widest uppercase transition-colors"
                                >
                                    I Understand The Rules
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
